openapi: 3.0.3
info:
  title: Servicio gabinete
  version: 0.1.0
  description: |
    La firma: clientes, abogados y catálogos (sedes, cargos, áreas de práctica). Honorarios, pagos,
    peritos y tarifas llegan en F4. A través del gateway las rutas llevan el prefijo /api.

    Errores: `{ "error": "mensaje" }` (y `campos` si falla la validación de la petición).
    - 400: petición mal formada o campos inválidos
    - 404: no existe
    - 409: documento, cédula, correo o tarjeta profesional repetidos; cliente con procesos u honorarios
    - 422: regla de negocio (persona jurídica sin NIT, cargo que no es de abogado, sede inexistente...)
    - 503: el servicio procesos no responde (al eliminar un cliente)
servers:
  - url: http://localhost:8091/api
    description: Gateway

paths:
  /clientes:
    get:
      summary: Lista clientes por nombre
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Busca en nombre y número de documento }
      responses:
        '200': { description: Clientes, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Cliente' } } } } }
    post:
      summary: Registra un cliente
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClienteSolicitud' } } } }
      responses:
        '201':
          description: Creado
          headers: { Location: { schema: { type: string, example: /clientes/30 } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Cliente' } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /clientes/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
    get:
      summary: Consulta un cliente
      responses:
        '200': { description: Cliente, content: { application/json: { schema: { $ref: '#/components/schemas/Cliente' } } } }
        '404': { $ref: '#/components/responses/Error' }
    put:
      summary: Actualiza un cliente (conserva la fecha de creación)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClienteSolicitud' } } } }
      responses:
        '200': { description: Actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/Cliente' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      summary: Elimina un cliente sin procesos ni honorarios
      description: Pregunta al servicio procesos si el cliente tiene procesos.
      responses:
        '204': { description: Eliminado }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /abogados:
    get:
      summary: Lista los abogados (personal cuyo cargo exige tarjeta profesional)
      parameters:
        - { name: soloActivos, in: query, schema: { type: boolean, default: false } }
      responses:
        '200': { description: Abogados, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Abogado' } } } } }
    post:
      summary: Registra un abogado
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AbogadoSolicitud' } } } }
      responses:
        '201':
          description: Creado
          content: { application/json: { schema: { $ref: '#/components/schemas/Abogado' } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /abogados/{id}:
    parameters: [ { name: id, in: path, required: true, description: Cédula, schema: { type: integer, format: int64 } } ]
    get:
      summary: Consulta un abogado (lo usa procesos para validar al responsable)
      responses:
        '200': { description: Abogado, content: { application/json: { schema: { $ref: '#/components/schemas/Abogado' } } } }
        '404': { $ref: '#/components/responses/Error' }
    put:
      summary: Actualiza un abogado (la cédula no cambia)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AbogadoSolicitud' } } } }
      responses:
        '200': { description: Actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/Abogado' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      summary: Desactiva al abogado
      description: No se borra; sus procesos lo siguen referenciando. Deja de poder ser responsable de procesos nuevos.
      responses:
        '200': { description: Abogado inactivo, content: { application/json: { schema: { $ref: '#/components/schemas/Abogado' } } } }
        '404': { $ref: '#/components/responses/Error' }

  /gabinete/sedes:
    get:
      summary: Sedes de la firma
      responses:
        '200': { description: Sedes, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Sede' } } } } }
  /gabinete/cargos:
    get:
      summary: Cargos (esAbogado indica si exige tarjeta profesional)
      responses:
        '200': { description: Cargos, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Cargo' } } } } }
  /gabinete/areas:
    get:
      summary: Áreas de práctica (una por rama)
      responses:
        '200': { description: Áreas, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AreaPractica' } } } } }

components:
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string }
              campos: { type: object, additionalProperties: { type: string } }
  schemas:
    ClienteSolicitud:
      type: object
      required: [tipoPersona, tipoDocumento, numeroDocumento, nombre, ciudad, idSede]
      properties:
        tipoPersona: { type: string, enum: [NATURAL, JURIDICA] }
        tipoDocumento: { type: string, enum: [CC, CE, NIT, PAS], description: JURIDICA siempre con NIT; NATURAL nunca con NIT }
        numeroDocumento: { type: string, description: 5 a 15 dígitos (pasaporte también letras), sin dígito de verificación }
        nombre: { type: string, maxLength: 150 }
        email: { type: string, format: email }
        telefono: { type: string, maxLength: 20 }
        direccion: { type: string, maxLength: 150 }
        ciudad: { type: string, maxLength: 60 }
        idSede: { type: integer }
    Cliente:
      allOf:
        - $ref: '#/components/schemas/ClienteSolicitud'
        - type: object
          properties:
            idCliente: { type: integer }
            creado: { type: string, format: date }

    AbogadoSolicitud:
      type: object
      required: [idPersona, nombres, apellidos, email, idCargo, idSede, tarjetaProfesional]
      properties:
        idPersona: { type: integer, format: int64, description: Cédula }
        nombres: { type: string, maxLength: 60 }
        apellidos: { type: string, maxLength: 60 }
        email: { type: string, format: email, description: Único; se guarda en minúsculas }
        telefono: { type: string }
        idCargo: { type: integer, description: Debe ser un cargo de abogado }
        idSede: { type: integer }
        idArea: { type: integer, nullable: true }
        tarjetaProfesional: { type: string, pattern: '^[0-9]{3,10}$', description: Única }
        tarifaHora: { type: number, minimum: 0 }
        fechaIngreso: { type: string, format: date, description: Por defecto, hoy }
        activo: { type: boolean, default: true }
    Abogado:
      allOf:
        - $ref: '#/components/schemas/AbogadoSolicitud'
        - type: object
          properties:
            cargo: { type: string }
            sede: { type: string }
            area: { type: string }

    Sede:
      type: object
      properties:
        idSede: { type: integer }
        nombre: { type: string }
        ciudad: { type: string }
        direccion: { type: string }
        telefono: { type: string }
        esPrincipal: { type: boolean }
    Cargo:
      type: object
      properties: { idCargo: { type: integer }, codigo: { type: string }, nombre: { type: string }, esAbogado: { type: boolean } }
    AreaPractica:
      type: object
      properties: { idArea: { type: integer }, codigoRama: { type: string }, nombre: { type: string }, idDirector: { type: integer, format: int64 } }
