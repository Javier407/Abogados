<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lexora · Cómo está construido</title>
<style>
  @font-face { font-family: "Jakarta"; src: url("jakarta.woff2") format("woff2"); font-weight: 200 800; }
  :root {
    --suelo: #f5f6fa; --tarjeta: #ffffff; --tinta: #0f1e45; --tinta2: #2b3a63; --gris: #5a6478; --linea: #e4e7ef;
    --acento: #4338ff; --acento-suave: #ecebff;
    --java: #e8710a; --java-s: #fff1e5; --python: #0e9f6e; --python-s: #e3f6ee; --web: #d6336c; --web-s: #fdecf2;
    --datos: #2f6fae; --datos-s: #e6f0fa; --mq: #7c3aed; --mq-s: #f1ebff; --seg: #4338ff; --seg-s: #ecebff;
    --ia: #0891b2; --ia-s: #e0f4f8; --ext: #5a6478; --ext-s: #eef0f5; --infra: #b45309; --infra-s: #fdf3dc;
    --mal: #b42318; --mal-s: #fdecea; --ok: #1f7a4d; --ok-s: #e4f4eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #dfe3ee; font-family: "Jakarta", "Segoe UI", sans-serif; color: var(--tinta); overflow: hidden; }
  #escenario { position: absolute; left: 50%; top: 50%; width: 1600px; height: 900px; transform-origin: 0 0; }
  .diapo { position: absolute; inset: 0; background: var(--suelo); border-radius: 18px; overflow: hidden; display: none; padding: 50px 80px 64px; }
  .diapo.activa { display: block; animation: entrar .35s ease-out; }
  @keyframes entrar { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .seccion { font-size: 15px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--acento); margin-bottom: 6px; }
  .seccion b { display: inline-block; background: var(--acento); color: #fff; border-radius: 6px; padding: 1px 7px; margin-right: 8px; letter-spacing: .04em; }
  h1 { font-size: 64px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
  h2 { font-size: 42px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; margin-bottom: 6px; }
  h2 em, h1 em { font-style: normal; color: var(--acento); }
  h3 { font-size: 22px; font-weight: 800; }
  .bajada { font-size: 21px; font-weight: 500; color: var(--gris); margin-bottom: 18px; max-width: 1360px; line-height: 1.4; }
  .pie { position: absolute; left: 80px; right: 80px; bottom: 22px; display: flex; justify-content: space-between; font-size: 14px; color: var(--gris); font-weight: 600; }
  .tarjeta { background: var(--tarjeta); border-radius: 18px; box-shadow: 0 1px 2px rgba(15,30,69,.05), 0 14px 32px -18px rgba(15,30,69,.28); padding: 20px 24px; }
  .rejilla { display: grid; gap: 18px; }
  .txt { font-size: 18px; line-height: 1.55; color: var(--tinta2); }
  .txt b { color: var(--tinta); }
  [data-paso] { transition: opacity .45s ease, transform .45s ease; }
  [data-paso].oculto { opacity: 0; transform: translateY(8px); pointer-events: none; }
  svg [data-paso].oculto { transform: none; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 10px; font-size: 15px; font-weight: 700; white-space: nowrap; }
  .k-java { color: var(--java); background: var(--java-s); } .k-python { color: var(--python); background: var(--python-s); }
  .k-web { color: var(--web); background: var(--web-s); } .k-datos { color: var(--datos); background: var(--datos-s); }
  .k-mq { color: var(--mq); background: var(--mq-s); } .k-seg { color: var(--seg); background: var(--seg-s); }
  .k-ia { color: var(--ia); background: var(--ia-s); } .k-ext { color: var(--ext); background: var(--ext-s); }
  .k-infra { color: var(--infra); background: var(--infra-s); } .k-mal { color: var(--mal); background: var(--mal-s); }
  .k-ok { color: var(--ok); background: var(--ok-s); }
  .leyenda { display: flex; flex-wrap: wrap; gap: 8px; }
  .leyenda .chip { font-size: 14px; padding: 3px 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 17px; }
  th { text-align: left; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--gris); padding: 7px 10px; border-bottom: 2px solid var(--linea); }
  td { padding: 8px 10px; border-bottom: 1px solid var(--linea); vertical-align: top; line-height: 1.35; }
  tr:last-child td { border-bottom: 0; }
  td.n { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .si { color: var(--ok); font-weight: 700; } .no { color: #9aa1b2; } .medio { color: #8a5a00; font-weight: 700; }
  code { font-family: Consolas, monospace; font-size: .88em; background: var(--ext-s); padding: 1px 6px; border-radius: 6px; color: var(--tinta2); }
  svg text { font-family: "Jakarta", sans-serif; }
  /* animación de lo que aparece en el paso actual */
  .anima .trazo, .anima.trazo { stroke-dasharray: 1; stroke-dashoffset: 1; animation: trazar .7s ease-out forwards; }
  @keyframes trazar { to { stroke-dashoffset: 0; } }
  .anima.nodo, .anima .nodo { animation: brotar .45s cubic-bezier(.2,.9,.3,1.3); transform-box: fill-box; transform-origin: center; }
  @keyframes brotar { from { transform: scale(.85); } to { transform: scale(1); } }
  .relleno { transition: width 1s cubic-bezier(.2,.8,.2,1); }
  .oculto .relleno { width: 0 !important; }
  .crece { transform-box: fill-box; transform-origin: bottom; transition: transform .9s cubic-bezier(.2,.8,.2,1); }
  .oculto .crece { transform: scaleY(0); }
  /* barra de avance, índice y ayuda */
  #barra { position: fixed; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(15,30,69,.08); }
  #avance { height: 100%; width: 0; background: var(--acento); transition: width .3s; }
  #botonIndice { position: fixed; left: 14px; top: 12px; font: inherit; font-size: 14px; font-weight: 700; color: var(--tinta2); background: rgba(255,255,255,.85);
    border: 0; border-radius: 10px; padding: 7px 12px; cursor: pointer; z-index: 5; }
  #ayuda { position: fixed; right: 14px; top: 12px; font-size: 13px; color: var(--gris); font-weight: 600; background: rgba(255,255,255,.85); padding: 7px 12px; border-radius: 10px; transition: opacity 1s; pointer-events: none; }
  #indice { position: fixed; inset: 0; background: rgba(15,30,69,.55); display: none; z-index: 10; padding: 50px; }
  #indice.abierto { display: flex; align-items: center; justify-content: center; }
  #indice .panel { background: #fff; border-radius: 20px; padding: 28px 32px; max-width: 1200px; width: 100%; max-height: 100%; overflow: auto; }
  #indice h3 { margin-bottom: 14px; }
  #indice .cols { columns: 3 300px; column-gap: 28px; }
  #indice .grupo { break-inside: avoid; margin-bottom: 14px; }
  #indice .grupo b { display: block; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--acento); margin-bottom: 4px; }
  #indice a { display: block; color: var(--tinta); text-decoration: none; font-size: 15px; padding: 3px 8px; border-radius: 8px; }
  #indice a:hover, #indice a:focus-visible { background: var(--acento-suave); outline: none; }
  #indice a span { color: var(--gris); font-variant-numeric: tabular-nums; margin-right: 8px; }
  /* diagramas de secuencia */
  .secuencia { display: grid; grid-template-columns: 1fr 360px; gap: 20px; height: 640px; }
  .secuencia .lienzo { background: var(--tarjeta); border-radius: 18px; box-shadow: 0 14px 32px -18px rgba(15,30,69,.28); padding: 8px 10px; }
  .nota { display: flex; flex-direction: column; gap: 12px; }
  .nota .paso-n { font-size: 14px; font-weight: 800; color: var(--acento); text-transform: uppercase; letter-spacing: .06em; }
  .nota .paso-t { font-size: 25px; font-weight: 800; line-height: 1.2; }
  .nota .paso-d { font-size: 19px; line-height: 1.45; color: var(--tinta2); }
  .nota .botones { margin-top: auto; display: flex; gap: 8px; }
  .nota button { font: inherit; font-size: 15px; font-weight: 700; padding: 9px 14px; border-radius: 12px; border: 0; cursor: pointer; background: var(--acento-suave); color: var(--acento); }
  .nota button.lleno { background: var(--acento); color: #fff; }
  /* patrones */
  .patrones { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .patron { display: grid; grid-template-columns: 410px 1fr; gap: 14px; align-items: center; padding: 14px 18px; height: 300px; }
  .patron h3 { font-size: 21px; margin: 8px 0 6px; }
  .patron p { font-size: 15.5px; line-height: 1.45; color: var(--tinta2); }
  /* barras de cobertura */
  .fila-barra { display: grid; grid-template-columns: 170px 1fr 150px; gap: 14px; align-items: center; font-size: 17px; font-weight: 700; }
  .pista { position: relative; height: 26px; background: var(--ext-s); border-radius: 8px; }
  .relleno { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 8px; }
  .minimo { position: absolute; top: -5px; bottom: -5px; width: 3px; background: var(--tinta); border-radius: 2px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="marcadores"></defs></svg>
<div id="escenario"></div>
<button id="botonIndice" type="button">☰ Índice</button>
<div id="ayuda">← → avanzar · I índice · F pantalla completa · A animación automática</div>
<div id="indice" role="dialog" aria-label="Índice de la presentación"><div class="panel"><h3>Índice</h3><div class="cols"></div></div></div>
<div id="barra"><div id="avance"></div></div>

<script>
/* =====================================================================
   Colores: uno por familia de tecnología
   ===================================================================== */
const K = { java: "#e8710a", python: "#0e9f6e", web: "#d6336c", datos: "#2f6fae", mq: "#7c3aed", seg: "#4338ff", ia: "#0891b2", ext: "#5a6478", infra: "#b45309", mal: "#b42318", ok: "#1f7a4d", gris: "#8a93a8", tinta: "#2b3a63" };
const KS = { java: "#fff1e5", python: "#e3f6ee", web: "#fdecf2", datos: "#e6f0fa", mq: "#f1ebff", seg: "#ecebff", ia: "#e0f4f8", ext: "#eef0f5", infra: "#fdf3dc", mal: "#fdecea", ok: "#e4f4eb", gris: "#f2f4f8", tinta: "#eef0f5" };
const LEYENDA = `<div class="leyenda">
  <span class="chip k-java">Java · Spring</span><span class="chip k-python">Python · FastAPI</span>
  <span class="chip k-web">Web · Angular</span><span class="chip k-datos">Datos · PostgreSQL</span>
  <span class="chip k-mq">Mensajería · RabbitMQ</span><span class="chip k-seg">Seguridad · Gateway</span>
  <span class="chip k-ia">IA local · Ollama</span><span class="chip k-infra">Infraestructura</span><span class="chip k-ext">Externo</span></div>`;

/* marcadores de flecha (uno por color) y de UML: definidos una sola vez, fuera de las diapositivas ocultas */
document.getElementById("marcadores").innerHTML = Object.entries(K).map(([k, c]) =>
  `<marker id="pt-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="${c}"/></marker>`).join("") + `
  <marker id="uml-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto"><path d="M1 1 L11 6 L1 11 z" fill="#fff" stroke="#2b3a63" stroke-width="1.4"/></marker>
  <marker id="uml-abierta" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#2b3a63" stroke-width="1.6"/></marker>
  <marker id="uml-rombo" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="15" markerHeight="10" orient="auto"><path d="M1 5 L8 1 L15 5 L8 9 z" fill="#2b3a63"/></marker>
  <marker id="uml-rombo-h" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="15" markerHeight="10" orient="auto"><path d="M1 5 L8 1 L15 5 L8 9 z" fill="#fff" stroke="#2b3a63" stroke-width="1.3"/></marker>`;

const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const pa = (p) => (p != null ? ` data-paso="${p}"` : "");

/* ---------- cajas y flechas ---------- */
function caja(n, paso) {
  const w = n.w || 220, h = n.h || 92, c = K[n.k], s = KS[n.k];
  const lineas = [n.t, ...(n.s ? [].concat(n.s) : [])];
  const tam = n.tam || 19;
  const txt = lineas.map((l, i) => `<text x="${n.x + w / 2 + 3}" y="${n.y + h / 2 + (i - (lineas.length - 1) / 2) * (tam + 3) + 6}" text-anchor="middle"
     font-size="${i ? tam - 4 : tam}" font-weight="${i ? 600 : 800}" fill="${i ? "#2b3a63" : "#0f1e45"}">${esc(l)}</text>`).join("");
  return `<g class="nodo"${pa(paso)}>
    <rect x="${n.x}" y="${n.y}" width="${w}" height="${h}" rx="14" fill="${s}" stroke="${c}" stroke-width="2.5"/>
    <rect x="${n.x}" y="${n.y + 6}" width="7" height="${h - 12}" rx="3.5" fill="${c}"/>${txt}</g>`;
}
function centro(n) { return [n.x + (n.w || 220) / 2, n.y + (n.h || 92) / 2]; }
function borde(n, hacia) {
  const [cx, cy] = centro(n), w = (n.w || 220) / 2, h = (n.h || 92) / 2, dx = hacia[0] - cx, dy = hacia[1] - cy;
  const t = Math.min(w / Math.abs(dx || 1e-6), h / Math.abs(dy || 1e-6));
  return [cx + dx * t, cy + dy * t];
}
function rotulo(x, y, texto, tam = 14, color = "#2b3a63") {
  if (!texto) return "";
  const w = texto.length * tam * 0.56 + 14;
  return `<rect x="${x - w / 2}" y="${y - tam + 1}" width="${w}" height="${tam + 9}" rx="7" fill="#fff" stroke="#e4e7ef"/>
    <text x="${x}" y="${y + 4}" text-anchor="middle" font-size="${tam}" font-weight="700" fill="${color}">${esc(texto)}</text>`;
}
/* flecha recta de borde a borde. o: { k: color, guion, en: posición del rótulo 0..1, doble } */
function flecha(a, b, texto, paso, o = {}) {
  const k = o.k || "gris", c = K[k];
  const [x1, y1] = borde(a, centro(b)), [x2, y2] = borde(b, centro(a));
  const t = o.en ?? 0.5, mx = x1 + (x2 - x1) * t, my = y1 + (y2 - y1) * t;
  return `<g${pa(paso)}><line class="${o.guion ? "" : "trazo"}" pathLength="1" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="2.5"
      ${o.guion ? 'stroke-dasharray="8 6"' : ""} marker-end="url(#pt-${k})" ${o.doble ? `marker-start="url(#pt-${k})"` : ""}/>${rotulo(mx, my, texto)}</g>`;
}
/* figura de actor UML */
function actor(x, y, t, color = "#0f1e45", paso) {
  return `<g class="nodo"${pa(paso)} stroke="${color}" stroke-width="3" fill="none"><circle cx="${x}" cy="${y - 52}" r="13"/><line x1="${x}" y1="${y - 39}" x2="${x}" y2="${y - 8}"/>
    <line x1="${x - 20}" y1="${y - 28}" x2="${x + 20}" y2="${y - 28}"/><line x1="${x}" y1="${y - 8}" x2="${x - 16}" y2="${y + 16}"/><line x1="${x}" y1="${y - 8}" x2="${x + 16}" y2="${y + 16}"/>
    <text x="${x}" y="${y + 40}" text-anchor="middle" font-size="17" font-weight="800" fill="${color}" stroke="none">${esc(t)}</text></g>`;
}
function elipse(x, y, t, k, paso, rx = 165) {
  return `<g class="nodo"${pa(paso)}><ellipse cx="${x}" cy="${y}" rx="${rx}" ry="34" fill="${KS[k]}" stroke="${K[k]}" stroke-width="2"/>
    <text x="${x}" y="${y + 6}" text-anchor="middle" font-size="15.5" font-weight="700" fill="#0f1e45">${esc(t)}</text></g>`;
}

/* ---------- diagrama de clases UML ---------- */
function clase(c, paso) {
  const w = c.w || 190, m = c.m || [], cab = c.est ? 46 : 32, h = cab + (m.length ? m.length * 19 + 10 : 0);
  c.w = w; c.h = h;
  const col = K[c.k || "tinta"], fondo = KS[c.k || "tinta"];
  return `<g class="nodo"${pa(paso)}><rect x="${c.x}" y="${c.y}" width="${w}" height="${h}" rx="8" fill="#fff" stroke="${col}" stroke-width="2"/>
    <path d="M${c.x} ${c.y + cab} V${c.y + 8} a8 8 0 0 1 8 -8 H${c.x + w - 8} a8 8 0 0 1 8 8 V${c.y + cab} z" fill="${fondo}" stroke="${col}" stroke-width="2"/>
    ${c.est ? `<text x="${c.x + w / 2}" y="${c.y + 17}" text-anchor="middle" font-size="12" font-style="italic" fill="${col}" font-weight="700">«${esc(c.est)}»</text>` : ""}
    <text x="${c.x + w / 2}" y="${c.y + cab - 10}" text-anchor="middle" font-size="15" font-weight="800" fill="#0f1e45">${esc(c.t)}</text>
    ${m.map((l, i) => `<text x="${c.x + 10}" y="${c.y + cab + 20 + i * 19}" font-size="12.5" font-weight="600" fill="#2b3a63">${esc(l)}</text>`).join("")}</g>`;
}
/* relaciones UML: hereda, realiza, usa, asoc, compone, agrega */
function rel(a, b, tipo, texto, paso) {
  const [x1, y1] = borde(a, centro(b)), [x2, y2] = borde(b, centro(a));
  const guion = tipo === "realiza" || tipo === "usa" ? 'stroke-dasharray="7 5"' : "";
  const fin = tipo === "hereda" || tipo === "realiza" ? "uml-tri" : tipo === "usa" || tipo === "asoc" ? "uml-abierta" : "";
  const ini = tipo === "compone" ? "uml-rombo" : tipo === "agrega" ? "uml-rombo-h" : "";
  return `<g${pa(paso)}><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#2b3a63" stroke-width="1.8" ${guion}
    ${fin ? `marker-end="url(#${fin})"` : ""} ${ini ? `marker-start="url(#${ini})"` : ""}/>${rotulo((x1 + x2) / 2, (y1 + y2) / 2, texto, 12.5)}</g>`;
}

/* ---------- entidades (modelo de datos) ---------- */
function entidad(e, paso) {
  const w = e.w || 250, h = 38 + e.c.length * 23 + 6;
  e.w = w; e.h = h;
  return `<g class="nodo"${pa(paso)}><rect x="${e.x}" y="${e.y}" width="${w}" height="${h}" rx="10" fill="#fff" stroke="${K[e.k]}" stroke-width="2"/>
    <path d="M${e.x} ${e.y + 36} V${e.y + 10} a10 10 0 0 1 10 -10 H${e.x + w - 10} a10 10 0 0 1 10 10 V${e.y + 36} z" fill="${K[e.k]}"/>
    <text x="${e.x + 14}" y="${e.y + 24}" font-size="15" font-weight="800" fill="#fff" letter-spacing=".04em">${esc(e.t)}</text>
    ${e.c.map(([llave, nombre, nota], i) => `<text x="${e.x + 12}" y="${e.y + 56 + i * 23}" font-size="11.5" font-weight="800" fill="${K[e.k]}">${llave || ""}</text>
      <text x="${e.x + 44}" y="${e.y + 56 + i * 23}" font-size="14" font-weight="600" fill="#0f1e45">${esc(nombre)}</text>
      ${nota ? `<text x="${e.x + w - 10}" y="${e.y + 56 + i * 23}" text-anchor="end" font-size="12" fill="#5a6478">${esc(nota)}</text>` : ""}`).join("")}</g>`;
}
function relER(a, b, ca, cb, verbo, paso) {
  const [x1, y1] = borde(a, centro(b)), [x2, y2] = borde(b, centro(a)), L = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / L, uy = (y2 - y1) / L;
  const et = (x, y, t) => `<text x="${x - uy * 11}" y="${y + ux * 11 + 5}" text-anchor="middle" font-size="14" font-weight="800" fill="#2f6fae">${t}</text>`;
  return `<g${pa(paso)}><line class="trazo" pathLength="1" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#7c8aa5" stroke-width="2"/>
    ${et(x1 + ux * 16, y1 + uy * 16, ca)}${et(x2 - ux * 16, y2 - uy * 16, cb)}${rotulo((x1 + x2) / 2, (y1 + y2) / 2, verbo, 12.5, "#5a6478")}</g>`;
}

/* ---------- diagrama de secuencia animado ---------- */
function secuencia(def) {
  const P = def.part, n = P.length, W = 1080, X0 = 74;
  const xs = P.map((_, i) => X0 + i * (W - 2 * X0) / Math.max(n - 1, 1));
  const anchoP = Math.min(140, (W - 2 * X0) / Math.max(n - 1, 1) - 12);
  const top = 12, cab = 62, fila = Math.max(40, Math.min(54, 500 / def.msj.length));
  const y0 = top + cab + 46, H = y0 + def.msj.length * fila + 6;
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" preserveAspectRatio="xMidYMin meet">`;
  (def.bloques || []).forEach((b) => {
    const ya = y0 + b.de * fila - 34, yb = y0 + b.a * fila + fila * 0.62, tw = b.txt.length * 7.4 + 22;
    svg += `<g${pa(b.de + 1)}><rect x="16" y="${ya}" width="${W - 32}" height="${yb - ya}" rx="10" fill="${KS[b.k || "seg"]}" fill-opacity=".45" stroke="${K[b.k || "seg"]}" stroke-dasharray="5 5"/>
      <path d="M${W - 16} ${ya + 10} a10 10 0 0 0 -10 -10 H${W - 16 - tw} v18 l10 8 H${W - 16} z" fill="${K[b.k || "seg"]}"/>
      <text x="${W - 16 - tw + 14}" y="${ya + 17}" font-size="13" font-weight="800" fill="#fff">${esc(b.txt)}</text></g>`;
  });
  P.forEach((p, i) => {

     <p class="txt" data-paso="3" style="font-size:16px">En F16 suben eficiencia de desempeño (7 → 8, carga medida) y capacidad de interacción (8 → 9, WCAG AA en el CI). Total: <b>9,40, excelente</b>.</p></div></div>` });
})();

/* --- Cierre --- */
S("Cierre", "Cierre", { html: `<div style="display:flex;align-items:center;gap:60px;height:100%;padding-bottom:30px">
  <img src="lawy.svg" alt="" style="width:380px">
  <div><h1 style="font-size:84px">Lexora<br><em>cada término, a tiempo</em></h1>
  <p class="bajada" style="margin-top:22px;font-size:25px">Microservicios políglotas con arquitectura hexagonal, eventos confiables con outbox, seguridad en cada capa y un despliegue propio, privado y respaldado.</p>
  <div class="leyenda" style="margin-top:18px"><span class="chip k-java">Términos controlados</span><span class="chip k-python">Rama Judicial vigilada</span><span class="chip k-seg">Datos protegidos</span><span class="chip k-ia">Lawy, siempre a mano</span></div></div></div>` });

/* =====================================================================
   Motor de la presentación
   ===================================================================== */
const escenario = document.getElementById("escenario");
const NOMBRE_SEC = { "06": "Eventos", "07": "Funcionamiento", "08": "Seguridad" };
D.forEach((d, i) => {
  const s = document.createElement("section");
  s.className = "diapo";
  s.setAttribute("aria-label", `${i + 1}. ${d.titulo}`);
  if (d.seq) {
    const num = d.sec.split(" · ")[0];
    s.innerHTML = `${cab(num, NOMBRE_SEC[num] || d.sec, d.titulo2 || d.titulo)}<p class="bajada" style="margin-bottom:12px">${esc(d.seq.bajada)}</p>${secuencia(d.seq)}`;
    d.pasos = d.seq.msj.length;
  } else s.innerHTML = d.html;
  s.insertAdjacentHTML("beforeend", `<div class="pie"><span>Lexora · cómo está construido</span><span>${i + 1} / ${D.length}</span></div>`);
  escenario.appendChild(s);
  d.el = s;
  d.pasos = d.pasos || 0;
});

/* índice */
(() => {
  const grupos = [];
  D.forEach((d, i) => { const g = grupos.find((x) => x.sec === d.sec); g ? g.items.push([i, d.titulo]) : grupos.push({ sec: d.sec, items: [[i, d.titulo]] }); });
  document.querySelector("#indice .cols").innerHTML = grupos.map((g) => `<div class="grupo"><b>${esc(g.sec)}</b>${g.items.map(([i, t]) => `<a href="#${i + 1}" data-ir="${i}"><span>${i + 1}</span>${esc(t)}</a>`).join("")}</div>`).join("");
})();
const indice = document.getElementById("indice");
let actual = 0, paso = 0, auto = null;
const abrirIndice = (si) => { indice.classList.toggle("abierto", si); if (si) indice.querySelector(`[data-ir="${actual}"]`)?.focus(); };

function ajustar() {
  const k = Math.min(innerWidth / 1640, innerHeight / 940);
  escenario.style.transform = `scale(${k}) translate(-50%, -50%)`;
}
function animarMensaje(g) {
  const p = g && g.querySelector(".punto");
  if (!p) return;
  const x1 = +g.dataset.x1, x2 = +g.dataset.x2, t0 = performance.now(), dur = 700;
  p.setAttribute("opacity", "1");
  (function cuadro(t) {
    const f = Math.min(1, (t - t0) / dur), e = f < .5 ? 2 * f * f : 1 - Math.pow(-2 * f + 2, 2) / 2;
    p.setAttribute("cx", x1 + (x2 - x1) * e);
    if (f < 1) requestAnimationFrame(cuadro); else p.setAttribute("opacity", "0");
  })(t0);
}
function pintar(animar) {
  D.forEach((d, i) => d.el.classList.toggle("activa", i === actual));
  const d = D[actual];
  d.el.querySelectorAll("[data-paso]").forEach((e) => {
    const n = +e.dataset.paso;
    e.classList.toggle("oculto", n > paso);
    e.classList.remove("anima");
    if (animar && n === paso) { void e.getBoundingClientRect(); e.classList.add("anima"); }
  });
  if (d.seq) {
    const n = d.el.querySelector(".nota"), m = d.seq.msj[paso - 1];
    n.querySelector(".pn").textContent = paso;
    n.querySelector(".paso-t").textContent = m ? m.d[0] : d.seq.intro[0];
    n.querySelector(".paso-d").textContent = m ? m.d[1] : d.seq.intro[1];
    d.el.querySelectorAll(".msj").forEach((g) => { const k = +g.dataset.paso; g.style.opacity = k === paso ? 1 : k < paso ? .5 : ""; });
    if (animar && paso > 0) animarMensaje(d.el.querySelector(`.msj[data-paso="${paso}"]`));
  }
  document.getElementById("avance").style.width = `${(actual + paso / Math.max(d.pasos, 1)) / (D.length - 1) * 100}%`;
  history.replaceState(null, "", `#${actual + 1}`);
}
function ir(i) { actual = Math.max(0, Math.min(D.length - 1, i)); paso = 0; pintar(false); }
function siguiente() {
  if (paso < D[actual].pasos) { paso++; pintar(true); return; }
  if (actual < D.length - 1) { actual++; paso = 0; pintar(false); }
  else pararAuto();
}
function anterior() {
  if (paso > 0) { paso--; pintar(false); return; }
  if (actual > 0) { actual--; paso = D[actual].pasos; pintar(false); }
}
function alternarAuto() {
  if (auto) return pararAuto();
  auto = setInterval(() => { if (paso >= D[actual].pasos) pararAuto(); else siguiente(); }, 2600);
  document.querySelectorAll(".auto").forEach((b) => b.textContent = "❚❚ Pausa");
  siguiente();
}
function pararAuto() { clearInterval(auto); auto = null; document.querySelectorAll(".auto").forEach((b) => b.textContent = "▶ Auto"); }
document.addEventListener("keydown", (e) => {
  if (indice.classList.contains("abierto")) { if (e.key === "Escape" || e.key.toLowerCase() === "i") abrirIndice(false); return; }
  if (["ArrowRight", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); pararAuto(); siguiente(); }
  else if (["ArrowLeft", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); pararAuto(); anterior(); }
  else if (e.key === "Home") ir(0);
  else if (e.key === "End") ir(D.length - 1);
  else if (e.key.toLowerCase() === "f") { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
  else if (e.key.toLowerCase() === "a") alternarAuto();
  else if (e.key.toLowerCase() === "i") abrirIndice(true);
});
document.addEventListener("click", (e) => {
  const a = e.target.closest("[data-ir]");
  if (a) { e.preventDefault(); abrirIndice(false); pararAuto(); ir(+a.dataset.ir); return; }
  if (e.target === indice) { abrirIndice(false); return; }
  if (e.target.closest("#botonIndice")) { abrirIndice(true); return; }
  if (e.target.closest(".adelante")) { pararAuto(); siguiente(); }
  else if (e.target.closest(".atras")) { pararAuto(); anterior(); }
  else if (e.target.closest(".auto")) alternarAuto();
});
addEventListener("resize", ajustar);
setTimeout(() => document.getElementById("ayuda").style.opacity = "0", 7000);
// #6 abre la diapositiva 6; #6.3 la abre en el paso 3 (#6.99 la muestra completa)
const [inicial, pasoInicial] = location.hash.slice(1).split(".").map((x) => parseInt(x, 10));
if (inicial >= 1 && inicial <= D.length) actual = inicial - 1;
if (pasoInicial > 0) paso = Math.min(pasoInicial, D[actual].pasos);
ajustar(); pintar(false);
</script>
</body>
</html>
