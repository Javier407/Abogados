# Sirve la aplicación Angular y reenvía /api al gateway (mismo origen: no hace falta CORS).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Avisos en vivo (Server-Sent Events): sin búfer y con conexión larga
  location /api/notificaciones/stream {
    proxy_pass http://gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass http://gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
  }

  # Rutas de Angular (/procesos, /clientes...): siempre index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Archivos con hash en el nombre: se pueden guardar en caché mucho tiempo
  location ~* \.(js|css|woff2?|ttf|svg|png|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
