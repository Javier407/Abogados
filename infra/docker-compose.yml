# Infraestructura del gabinete (fases F1 a F9): PostgreSQL, RabbitMQ, microservicios, gateway, frontend, Mailpit y Ollama.
# Secretos fuera de git: infra/.env y infra/secretos/ (llave privada de los tokens). Ver README.
# Uso:  cd infra && cp .env.example .env  (escribir las claves)  &&  docker compose up -d --build
# La primera vez que se crea el volumen de PostgreSQL se ejecuta db/00-init.sh: crea los esquemas y carga los datos de prueba.
# Para recargar la base desde cero: docker compose down -v && docker compose up -d   (borra los volúmenes)
#
# Por la VPN solo se publican el frontend (8090) y el buzón de pruebas Mailpit (8092). El gateway (8091) y la entrada de
# tailscale serve (8093, HTTPS) solo escuchan en la propia VM. PostgreSQL, RabbitMQ y los servicios solo son visibles
# dentro de la red interna de compose; aun así cada servicio verifica el token de cada petición (F9).

name: abogados

x-logs: &logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-java-salud: &java-salud
  test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/liveness || exit 1"]
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 60s

services:
  postgres:
    image: postgres:16.4-alpine
    container_name: abogados-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: America/Bogota
      PGTZ: America/Bogota
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db:/docker-entrypoint-initdb.d:ro
    # Para conectarse desde el mismo equipo (DBeaver, pgAdmin), descomentar:
    # ports:
    #   - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    logging: *logs

  # Copia diaria de la base (pg_dump) y de los documentos en ./respaldos, 14 días de historia. Ver respaldo/respaldar.sh.
  # Fuera de la VM: infra/respaldo/copiar-al-pc.ps1 (tarea programada en el PC de Javier).
  # Solo recibe las credenciales de PostgreSQL, no el resto del .env.
  respaldo:
    image: postgres:16.4-alpine
    container_name: abogados-respaldo
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/respaldo/respaldar.sh"]
    environment:
      TZ: America/Bogota
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      HORA_RESPALDO: "02:30"
      RETENER_DIAS: "14"
      # Dueño de los archivos (usuario de la VM): la copia diaria al PC los descarga por SSH (F10).
      PROPIETARIO: ${PROPIETARIO_RESPALDOS:-1000:1000}
    volumes:
      - ./respaldo/respaldar.sh:/respaldo/respaldar.sh:ro
      - ./respaldos:/respaldos
      - documentos:/documentos:ro
    depends_on:
      postgres:
        condition: service_healthy
      # procesos crea primero el volumen documentos, con su usuario como dueño (si no, quedaría de root)
      procesos:
        condition: service_started
    healthcheck:
      # Sano si hay un respaldo de menos de 26 horas
      test: ["CMD-SHELL", "find /respaldos -name 'gabinete-*.dump' -mmin -1560 | grep -q ."]
      interval: 5m
      timeout: 10s
      start_period: 2m
    mem_limit: 128m
    logging: *logs

  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    container_name: abogados-rabbitmq
    restart: unless-stopped
    hostname: abogados-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    # Consola de administración (solo desde el servidor, por túnel SSH):
    # ports:
    #   - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
    mem_limit: 256m
    logging: *logs

  identidad:
    build: ../servicios/identidad
    image: abogados/identidad:0.1.0
    container_name: abogados-identidad
    restart: unless-stopped
    environment:
      TZ: America/Bogota
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USER: svc_identidad
      DB_PASSWORD: ${SVC_PASSWORD}
      JWT_LLAVE_PRIVADA: /run/secrets/jwt-privada.pem
      # F9: el refresh token va en una cookie Secure (solo HTTPS). false únicamente mientras no haya HTTPS.
      COOKIE_SEGURA: ${COOKIE_SEGURA:-true}
      # F13: verificación en dos pasos. Llave AES de los secretos (32 bytes en Base64) y roles que deben usarla.
      MFA_CLAVE_CIFRADO: ${MFA_CLAVE_CIFRADO:-}
      MFA_OBLIGATORIO_ROLES: ${MFA_OBLIGATORIO_ROLES:-}
      # Clave de cada servicio para pedir su token (infra/.env, generadas en el servidor, nunca en git)
      SERVICIOS_CLAVES: procesos=${CLAVE_SVC_PROCESOS:-},gabinete=${CLAVE_SVC_GABINETE:-},notificaciones=${CLAVE_SVC_NOTIFICACIONES:-},vigilancia=${CLAVE_SVC_VIGILANCIA:-},asistente-ia=${CLAVE_SVC_ASISTENTE:-}
    volumes:
      # Llave privada RSA que firma los tokens: solo este servicio la ve, y en solo lectura.
      - ./secretos/jwt-privada.pem:/run/secrets/jwt-privada.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: *java-salud
    mem_limit: 384m
    logging: *logs

  gabinete:
    build: ../servicios/gabinete
    image: abogados/gabinete:0.1.0
    container_name: abogados-gabinete
    restart: unless-stopped
    environment:
      TZ: America/Bogota
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USER: svc_gabinete
      DB_PASSWORD: ${SVC_PASSWORD}
      PROCESOS_URL: http://procesos:8080
      IDENTIDAD_URL: http://identidad:8080
      SERVICIO_CLAVE: ${CLAVE_SVC_GABINETE:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: *java-salud
    mem_limit: 384m
    logging: *logs

  procesos:
    build: ../servicios/procesos
    image: abogados/procesos:0.1.0
    container_name: abogados-procesos
    restart: unless-stopped
    environment:
      TZ: America/Bogota
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USER: svc_procesos
      DB_PASSWORD: ${SVC_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      GABINETE_URL: http://gabinete:8080
      IDENTIDAD_URL: http://identidad:8080
      SERVICIO_CLAVE: ${CLAVE_SVC_PROCESOS:-}
    volumes:
      # Expediente digital (F10): archivos de los documentos. Entra en la copia diaria (contenedor respaldo).
      - documentos:/datos/documentos
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck: *java-salud
    mem_limit: 384m
    logging: *logs

  notificaciones:
    build: ../servicios/notificaciones
    image: abogados/notificaciones:0.1.0
    container_name: abogados-notificaciones
    restart: unless-stopped
    environment:
      TZ: America/Bogota
      DB_URL: postgresql://svc_notificaciones:${SVC_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      GABINETE_URL: http://gabinete:8080
      URL_APP: ${URL_PUBLICA:-http://100.65.152.112:8090}
      IDENTIDAD_URL: http://identidad:8080
      SERVICIO_CLAVE: ${CLAVE_SVC_NOTIFICACIONES:-}
      # Por defecto los correos van a Mailpit (no salen a internet). Para correo real, definir SMTP_* en .env.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PUERTO: ${SMTP_PUERTO:-1025}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_CLAVE: ${SMTP_CLAVE:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      CORREO_REMITENTE: ${CORREO_REMITENTE:-Gestion Juridica <avisos@gestion-juridica.local>}
      PROCESOS_URL: http://procesos:8080
      # Bot de Telegram (lo crea Javier en @BotFather y lo escribe en .env). Vacío = canal apagado.
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/salud', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 192m
    logging: *logs

  vigilancia:
    build: ../servicios/vigilancia
    image: abogados/vigilancia:0.1.0
    container_name: abogados-vigilancia
    restart: unless-stopped
    environment:
      TZ: America/Bogota
      DB_URL: postgresql://svc_vigilancia:${SVC_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      PROCESOS_URL: http://procesos:8080
      IDENTIDAD_URL: http://identidad:8080
      SERVICIO_CLAVE: ${CLAVE_SVC_VIGILANCIA:-}
      # Consulta real al portal de la Rama Judicial: solo para los radicados con fuente PORTAL_HTTP
      # (los de la base de pruebas usan MANUAL o SIMULADA). Espaciada: mínimo 12 h por radicado y 10 s entre consultas.
      PORTAL_HABILITADO: ${PORTAL_HABILITADO:-true}
      PAUSA_PORTAL_SEG: 10
      CICLO_MINUTOS: 10
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/salud', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 192m
    logging: *logs

  asistente-ia:
    build: ../servicios/asistente-ia
    image: abogados/asistente-ia:0.1.0
    container_name: abogados-asistente-ia
    restart: unless-stopped
    environment:
      TZ: America/Bogota
      OLLAMA_URL: http://ollama:11434
      MODELO: ${MODELO_IA:-qwen2.5:3b}
      MAX_TOKENS: 1000                  # acota el tiempo en CPU (unos 3 a 5 minutos por borrador)
      PROCESOS_URL: http://procesos:8080
      GABINETE_URL: http://gabinete:8080
      IDENTIDAD_URL: http://identidad:8080
      SERVICIO_CLAVE: ${CLAVE_SVC_ASISTENTE:-}
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/salud', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 192m
    logging: *logs

  # Modelo de lenguaje local para el asistente (sin GPU). Los textos de los procesos no salen del servidor.
  ollama:
    image: ollama/ollama:0.5.4
    container_name: abogados-ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 30m        # descarga el modelo de la RAM tras 30 min sin uso
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
    volumes:
      - ollama-modelos:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 3g
    cpus: 3                         # deja al menos un núcleo para los demás servicios
    logging: *logs

  # Buzón de pruebas: recibe todos los correos y los muestra en http://<servidor>:8092 sin entregarlos.
  mailpit:
    image: axllent/mailpit:v1.20.0
    container_name: abogados-mailpit
    restart: unless-stopped
    environment:
      TZ: America/Bogota
      MP_MAX_MESSAGES: 500
      # Usuario y contraseña para ver el buzón ("usuario:clave", en .env). Vacío = sin contraseña.
      MP_UI_AUTH: ${MAILPIT_UI_AUTH:-}
    ports:
      - "8092:8025"
    mem_limit: 64m
    logging: *logs

  gateway:
    build: ../servicios/gateway
    image: abogados/gateway:0.1.0
    container_name: abogados-gateway
    restart: unless-stopped
    environment:
      TZ: America/Bogota
      GABINETE_URL: http://gabinete:8080
      PROCESOS_URL: http://procesos:8080
      NOTIFICACIONES_URL: http://notificaciones:8000
      VIGILANCIA_URL: http://vigilancia:8000
      ASISTENTE_URL: http://asistente-ia:8000
      IDENTIDAD_URL: http://identidad:8080
      CORS_ORIGINS: http://localhost:4200${URL_PUBLICA:+,}${URL_PUBLICA:-}
    # F9: solo desde la propia VM (diagnóstico); desde la VPN se entra por el frontend (y por HTTPS).
    ports:
      - "127.0.0.1:8091:8080"
    depends_on:
      - gabinete
      - procesos
      - notificaciones
      - vigilancia
      - asistente-ia
      - identidad
    healthcheck: *java-salud
    mem_limit: 384m
    logging: *logs

  frontend:
    build: ../frontend
    image: abogados/frontend:0.1.0
    container_name: abogados-frontend
    restart: unless-stopped
    environment:
      # Dirección HTTPS de tailscale serve (p. ej. https://docker-server.<tailnet>.ts.net). Vacía = sin redirección.
      URL_PUBLICA: ${URL_PUBLICA:-}
    ports:
      - "8090:80"              # HTTP por la VPN; redirige a URL_PUBLICA cuando existe
      - "127.0.0.1:8093:81"    # entrada de tailscale serve (HTTPS), solo local
    depends_on:
      - gateway
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:81/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 64m
    logging: *logs

volumes:
  pgdata:
  rabbitdata:
  documentos:
  ollama-modelos:
