# Infraestructura del gabinete (fase F0: solo la base de datos de pruebas).
# Uso:  cd infra && cp .env.example .env  (cambiar las claves)  &&  docker compose up -d
# La primera vez que se crea el volumen se ejecuta db/00-init.sh: crea los esquemas y carga los datos de prueba.
# Para recargar desde cero: docker compose down -v && docker compose up -d   (borra el volumen de datos)

name: abogados

services:
  postgres:
    image: postgres:16.4-alpine
    container_name: abogados-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: America/Bogota
      PGTZ: America/Bogota
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db:/docker-entrypoint-initdb.d:ro
    # Sin puerto publicado: los servicios la ven por la red interna.
    # Para conectarse desde el mismo equipo (DBeaver, pgAdmin), descomentar:
    # ports:
    #   - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
