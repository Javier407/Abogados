spring:
  application:
    name: gabinete
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gabinete}
    username: ${DB_USER:svc_gabinete}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  shutdown: graceful

procesos:
  url: ${PROCESOS_URL:http://localhost:8082}

management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true

# F9: cada servicio verifica el token (llave pública de identidad) y llama a los demás con su propio token.
identidad:
  url: ${IDENTIDAD_URL:http://localhost:8005}
jwt:
  jwks-uri: ${IDENTIDAD_URL:http://localhost:8005}/.well-known/jwks.json
  emisor: gestion-juridica
servicio:
  clave: ${SERVICIO_CLAVE:}
