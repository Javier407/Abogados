# Rutas: /api/<recurso>/** -> servicio dueño del recurso, quitando el prefijo /api.
# Los servicios se encuentran por el DNS de Docker Compose (sin Eureka).
spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: gabinete
          uri: ${GABINETE_URL:http://localhost:8081}
          predicates:
            - Path=/api/clientes/**,/api/abogados/**,/api/gabinete/**,/api/peritos/**,/api/honorarios/**
          filters:
            - StripPrefix=1
        - id: procesos
          uri: ${PROCESOS_URL:http://localhost:8082}
          predicates:
            - Path=/api/procesos/**,/api/catalogos/**,/api/terminos/**,/api/calendario/**
          filters:
            - StripPrefix=1
        - id: notificaciones
          uri: ${NOTIFICACIONES_URL:http://localhost:8000}
          predicates:
            - Path=/api/notificaciones/**
          filters:
            - StripPrefix=1
        - id: asistente
          uri: ${ASISTENTE_URL:http://localhost:8004}
          predicates:
            - Path=/api/asistente/**
          filters:
            - StripPrefix=1
        - id: vigilancia
          uri: ${VIGILANCIA_URL:http://localhost:8003}
          predicates:
            - Path=/api/vigilancia/**
          filters:
            - StripPrefix=1
      # Solo para desarrollo con "ng serve" en el PC; en el servidor el frontend llega por el mismo origen (nginx).
      globalcors:
        cors-configurations:
          '[/api/**]':
            allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
            allowed-methods: GET,POST,PUT,DELETE,OPTIONS
            allowed-headers: "*"
            max-age: 3600

server:
  port: 8080

management:
  endpoints.web.exposure.include: health,info,gateway
  endpoint.health.probes.enabled: true
  endpoint.gateway.enabled: true
