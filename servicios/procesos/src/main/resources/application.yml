spring:
  application:
    name: procesos
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gabinete}
    username: ${DB_USER:svc_procesos}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  shutdown: graceful

gabinete:
  url: ${GABINETE_URL:http://localhost:8081}

eventos:
  exchange: gabinete.eventos

management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true

terminos:
  dias-aviso: 5                 # avisar desde 5 días hábiles antes del vencimiento
  dias-recordar-vencidos: 3     # y recordar los vencidos durante 3 días hábiles más
  cron: "0 0 7 * * MON-FRI"     # revisión diaria, hora de Colombia

# Al consumir eventos: hasta 4 intentos espaciados (p. ej. base de datos reiniciando) y luego se descarta.
spring.rabbitmq.listener.simple:
  default-requeue-rejected: false
  retry:
    enabled: true
    max-attempts: 4
    initial-interval: 2s
    multiplier: 3
