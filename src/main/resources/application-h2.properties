# =====================================================================
#  Perfil H2 (base de datos en memoria) - levantamiento sencillo
#  No requiere instalar ni configurar nada: la BD vive en RAM y se
#  crea/borra cada vez que arranca la aplicación.
# =====================================================================
spring.datasource.url=jdbc:h2:mem:gabinete;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Carga data-h2.sql (clientes, abogados y asuntos de ejemplo) DESPUÉS de que
# Hibernate cree las tablas.
spring.sql.init.platform=h2
spring.jpa.defer-datasource-initialization=true

# Consola web de H2 para ver las tablas:
#   http://localhost:8080/h2-console
#   JDBC URL: jdbc:h2:mem:gabinete   (User: sa,  sin password)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
