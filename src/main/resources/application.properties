# =====================================================================
#  Configuración común
# ---------------------------------------------------------------------
#  Perfil activo por defecto: h2  -> la app arranca SIN instalar MySQL.
#  Para usar MySQL como en el taller, cambia h2 por mysql:
#      spring.profiles.active=mysql
#  (y asegúrate de haber ejecutado sql/tiendagenerica.sql)
# =====================================================================
spring.profiles.active=mysql

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
